name: Validation

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy Pillow scikit-learn
      - run: python -m py_compile src/advanced_pipeline.py src/clinical_safety_pipeline.py assistant/explain_outputs.py
      - run: python -m unittest discover -s tests -v
